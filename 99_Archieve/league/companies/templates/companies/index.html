<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기업 게시판</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; }
        .article-card { border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; }
        .article-header { display: flex; justify-content: space-between; align-items: center; }
        .badge { padding: 2px 6px; border-radius: 4px; background: #eee; font-size: 12px; }
        .comment { font-size: 14px; border-top: 1px solid #eee; padding: 4px 0; display: flex; justify-content: space-between; }
        .comment small { color: #666; }
        .comment button { font-size: 12px; }
    </style>
</head>
<body>
    <div id="app">
        <h1>기업 게시판</h1>
        <!-- 현재로그인 유저정보 (백엔드 해조) -->
        <p>로그인 유저: <strong>{{ currentUser?.username || '로그인 필요'}}</strong></p>

        <hr>

        <!-- 기업 선택(간단 드롭다운) -->
        <label>
            기업 선택:
            <select v-model="selectorCompany" @change="fetchArticles" id="">
                <option disabled value="">기업을 선택하세요</option>
                <option v-for="company in companies" :key="company.id" :value="company.id">
                    {{ company.name}}
                </option>
            </select>
        </label>

        <hr>

        <!-- 게시글 작성 끝 -->
        <h2>게시글 작성</h2>
        <form @submit.prevent="createArticle">
            <div>
                <input v-model="newArticle.title" placeholder="제목" required>
            </div>
            <div>
                <textarea v-model="newArticle.content" placeholder="내용"></textarea>
            </div>
            <button type="submit">작성</button>
        </form>

        <hr>

        <!-- 게시글 목록 -->
        <h2>게시글 목록</h2>
        <div v-if="articles.length === 0">
            아직 게시글이 없습니다.
        </div>
        <div v-for="article in articles" :key="article.id" class="article-card">
            <div class="article-header">
                <div>
                    <strong>{{article.title}}</strong>
                    <span class=""bagde>by {{article.user_username}}</span>
                </div>
                <button @click="toggleLike(article)">
                    ❤️ {{ article.like_count }}개
                </button>
            </div>
            <p>{{article.content}}</p>
            <small>작성일: {{ article.created_at}}</small>

            <hr>

            <!-- 댓글 영역 -->
            <div>
                <h4>댓글</h4>
                <div v-if="article.comments && article.comments.length">
                    <div v-for="comment in article.comments" :key="comment.id" class="comment">
                        <div>
                            <strong>{{ comment.user_username}}</strong>
                            {{ comment.content}}
                        </div>
                        <button v-if="comment.user_id === currentUser?.id" @click="deleteComment(article, comment)">
                            삭제
                        </button>
                    </div>
                </div>
                <div v-else>
                    아직 댓글이 없습니다.
                </div>

                <!-- 댓글 작성 -->
                <form @submit.prevent="createComment(article)">
                    <input v-model="article.newComment" placeholder="댓글 입력...">
                    <button type="submit">등록</button>
                </form>
            </div>
        </div>
    </div>

    
    <script>
        const { createApp } = Vue

        createApp({
        data() {
            return {
            // 실제로는 로그인 API로 받아올 값
            currentUser: {
                id: 1,
                username: 'test_user',
            },
            companies: [
                // 실제로는 GET /api/companies/ 같은 걸로 받아오겠지
                { id: 1, name: '삼성전자' },
                { id: 2, name: '카카오' },
                { id: 3, name: '네이버' },
            ],
            selectedCompany: '',
            articles: [],
            newArticle: {
                title: '',
                content: '',
            },
            }
        },
        methods: {
            // 기업별 게시글 목록 불러오기
            async fetchArticles() {
            if (!this.selectedCompany) return
            try {
                const res = await axios.get(
                `http://127.0.0.1:8000/api/companies/${this.selectedCompany}/articles/`
                )
                // 백엔드에서 comments, like_count 등을 같이 내려준다고 가정
                this.articles = res.data.map(article => ({
                ...article,
                newComment: '',       // 각 글 카드 안에서만 사용하는 입력값
                }))
            } catch (error) {
                console.error(error)
                alert('게시글을 불러오지 못했습니다.')
            }
            },

            // 게시글 작성
            async createArticle() {
            if (!this.selectedCompany) {
                alert('기업을 먼저 선택하세요.')
                return
            }
            try {
                const payload = {
                title: this.newArticle.title,
                content: this.newArticle.content,
                company_id: this.selectedCompany,
                }
                const res = await axios.post(
                'http://127.0.0.1:8000/api/articles/',
                payload,
                { withCredentials: true }
                )
                // 새 글을 목록 맨 위에 추가
                this.articles.unshift({
                ...res.data,
                newComment: '',
                })
                this.newArticle.title = ''
                this.newArticle.content = ''
            } catch (error) {
                console.error(error)
                alert('게시글 작성에 실패했습니다.')
            }
            },

            // 좋아요 토글
            async toggleLike(article) {
            try {
                const res = await axios.post(
                `http://127.0.0.1:8000/api/articles/${article.id}/like/`,
                {},
                { withCredentials: true }
                )
                // 백엔드에서 { like_count, is_liked } 같은 걸 내려준다고 가정
                article.like_count = res.data.like_count
            } catch (error) {
                console.error(error)
                alert('좋아요 처리에 실패했습니다.')
            }
            },

            // 댓글 작성
            async createComment(article) {
            if (!article.newComment) return
            try {
                const payload = {
                content: article.newComment,
                }
                const res = await axios.post(
                `http://127.0.0.1:8000/api/articles/${article.id}/comments/`,
                payload,
                { withCredentials: true }
                )
                // 새 댓글을 바로 추가
                article.comments.push(res.data)
                article.newComment = ''
            } catch (error) {
                console.error(error)
                alert('댓글 작성에 실패했습니다.')
            }
            },

            // 댓글 삭제
            async deleteComment(article, comment) {
            if (!confirm('정말 삭제하시겠습니까?')) return
            try {
                await axios.delete(
                `http://127.0.0.1:8000/api/comments/${comment.id}/`,
                { withCredentials: true }
                )
                article.comments = article.comments.filter(c => c.id !== comment.id)
            } catch (error) {
                console.error(error)
                alert('댓글 삭제에 실패했습니다.')
            }
            },
        },
        mounted() {
            // 기본 선택 기업 설정 (있으면)
            if (this.companies.length) {
            this.selectedCompany = this.companies[0].id
            this.fetchArticles()
            }
        },
        }).mount('#app')
    </script>
</body>
</html>
